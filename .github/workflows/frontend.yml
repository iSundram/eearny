name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build auth app
        working-directory: frontend/apps/auth
        run: |
          npm ci
          npx vite build

      - name: Build myaccount app
        working-directory: frontend/apps/myaccount
        run: |
          npm ci
          BASE_PATH=/myaccount/ npx vite build

      - name: Merge deploy directory
        run: |
          mkdir -p site/myaccount site/signup site/forgot
          cp -r frontend/apps/auth/dist/* site/
          cp -r frontend/apps/myaccount/dist/* site/myaccount/
          cp site/index.html site/signup/index.html
          cp site/index.html site/forgot/index.html
          for d in invest notifications account account/overview account/transactions account/payment account/settings; do mkdir -p "site/myaccount/$d" && cp site/myaccount/index.html "site/myaccount/$d/index.html"; done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=eearny --branch=main --commit-dirty=true
